# One command brings the whole stack up, seeded and ready:
#     docker compose up --build
# then open http://localhost:5173/console.html and sign in with `demo-kabir`
# (warehouse clerk), `demo-nina` (sales), `demo-tara` (accountant), and so on.
services:
  backend:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      ERP_DEMO: "1"          # predictable demo tokens; see README, not for real data
      ERP_DB: /data/mini_erp.db
    ports: ["8080:8080"]
    volumes:
      - erpdata:/data        # survives `docker compose restart`; see README limits
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 3s

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on:
      backend:
        condition: service_healthy   # the console never loads against a dead API
    # No env here on purpose: the console is static files, so its API base comes
    # from config.js, whose default already points at localhost:8080.

volumes:
  erpdata:
