# Render Blueprint: creates both services from this repo in one action.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: northwind-erp-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ERP_DEMO
        value: "1"

  - type: web
    name: northwind-erp-console
    runtime: static
    # No `plan:` here on purpose -- Render static sites have no plan field and
    # reject one ("no such plan free for service type web").
    rootDir: frontend
    staticPublishPath: .
    # No build step: config.js picks its API by hostname. `fromService` with
    # property: host returned the bare service name, not the full domain, which
    # silently produced an unreachable URL -- so the wiring is explicit instead.
